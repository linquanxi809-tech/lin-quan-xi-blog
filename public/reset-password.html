<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重置密码 · 围坐篝火话天下</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html"><span class="dot"></span>小站</a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <span id="auth-area" class="auth-area"></span>
      </nav>
    </div>
  </header>

  <section class="section wrap">
    <div class="section-head reveal">
      <h2><span class="emoji">🔐</span> 设置新密码</h2>
    </div>
    <form class="editor reveal" id="reset-form" style="max-width:460px; margin:0 auto">
      <label class="field">
        <span>新密码</span>
        <input type="password" name="password" placeholder="至少 6 位" required />
      </label>
      <label class="field" style="margin-top:16px">
        <span>确认新密码</span>
        <input type="password" name="confirm" placeholder="再次输入" required />
      </label>
      <div class="actions" style="margin-top:20px">
        <button type="submit" class="btn btn-primary">重置密码</button>
      </div>
      <div class="hint" id="msg"></div>
    </form>
  </section>

  <footer class="footer">
    <div class="wrap">
      <p>© <span id="year">2026</span> 林泉汐 · 用 ❤️ 和 Node.js 搭建</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      App.renderAuthUI();
      var token = new URLSearchParams(location.search).get("token") || "";
      var form = document.getElementById("reset-form");
      var msg = document.getElementById("msg");
      if (!token) msg.textContent = "缺少重置令牌，请使用邮件中的链接。";
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        if (!token) return;
        if (form.password.value !== form.confirm.value) {
          msg.textContent = "两次输入的密码不一致。";
          return;
        }
        msg.textContent = "提交中…";
        App.api("/api/reset-password", {
          method: "POST",
          body: { token: token, password: form.password.value },
        })
          .then(function () { location.href = "login.html?reset=1"; })
          .catch(function (err) { msg.textContent = "失败：" + err.message; });
      });
    })();
  </script>
</body>
</html>
