<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>注册 · 围坐篝火话天下</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html"><span class="dot"></span><span class="brand-text">勇者聚集人数 · <span class="online-num">0</span>人</span></a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <span id="auth-area" class="auth-area"></span>
      </nav>
    </div>
  </header>

  <section class="section wrap">
    <div class="section-head reveal">
      <h2><span class="emoji">📝</span> 注册新账号</h2>
    </div>
    <form class="editor reveal" id="register-form" style="max-width:460px; margin:0 auto">
      <label class="field">
        <span>用户名</span>
        <input type="text" name="username" placeholder="至少 2 个字符" required />
      </label>
      <label class="field" style="margin-top:16px">
        <span>邮箱（用于验证与找回密码）</span>
        <input type="email" name="email" placeholder="you@example.com" />
      </label>
      <label class="field" style="margin-top:16px">
        <span>密码</span>
        <div class="password-field">
          <input type="password" name="password" id="register-password" placeholder="至少 6 位" required />
          <button type="button" class="toggle-pwd" data-target="register-password" aria-label="显示密码">👁️</button>
        </div>
      </label>
      <div class="actions" style="margin-top:20px">
        <button type="submit" class="btn btn-primary">注册并登录</button>
        <a class="btn btn-ghost" href="login.html">已有账号？登录</a>
      </div>
      <div class="hint" id="msg"></div>
    </form>
  </section>

  <footer class="footer">
    <div class="wrap">
      <p>© <span id="year">2026</span> 林泉汐 · 用 ❤️ 和 Node.js 搭建</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      App.renderAuthUI();
      document.querySelectorAll(".toggle-pwd").forEach(function (btn) {
        btn.addEventListener("click", function () {
          var input = document.getElementById(this.dataset.target);
          if (!input) return;
          var isPwd = input.type === "password";
          input.type = isPwd ? "text" : "password";
          this.setAttribute("aria-label", isPwd ? "隐藏密码" : "显示密码");
          this.textContent = isPwd ? "🙈" : "👁️";
        });
      });
      var form = document.getElementById("register-form");
      var msg = document.getElementById("msg");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        msg.textContent = "";
        App.api("/api/register", {
          method: "POST",
          body: {
            username: form.username.value.trim(),
            email: form.email.value.trim(),
            password: form.password.value,
          },
        })
          .then(function (data) {
            if (data && data.devLink) {
              // 邮件服务未配置时的兜底：直接展示验证链接
              msg.innerHTML =
                '邮件服务未配置，请手动点击下面的链接完成验证：<br><a href="' +
                data.devLink +
                '" style="color:#ffca28;word-break:break-all">' +
                data.devLink +
                "</a>";
              msg.style.color = "#cbb8e8";
            } else {
              location.href = "index.html?welcome=1";
            }
          })
          .catch(function (err) {
            msg.textContent = "注册失败：" + err.message;
          });
      });
    })();
  </script>
</body>
</html>
