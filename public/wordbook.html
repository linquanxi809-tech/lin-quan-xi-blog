  <section class="hero wrap">
    <span class="badge">📚 14 本词书 · 近 800 词</span>

    <div>
      <a class="btn btn-primary" href="#books">📖 挑词书</a>
      <a class="btn btn-ghost" href="words.html">🔤 今日单词</a>

  <section class="section wrap" id="books">
    <div class="section-head reveal">
      <h2><span class="emoji">🗂️</span> 全部词书</h2>
      <span class="word-progress-chip" id="active-chip">当前推送：加载中</span>
    </div>
    <div class="wb-grid" id="book-grid">
      <p style="color:var(--ink-soft)">正在加载词书…</p>
    </div>
  </section>

  <section class="section wrap" id="detail" hidden>
    <div class="section-head reveal">
      <h2><span class="emoji">🔍</span> <span id="detail-title">词表</span></h2>
      <button class="btn btn-sm" type="button" id="set-active" hidden>✅ 设为每日推送词书</button>
    </div>
    <div class="wb-today" id="wb-today"></div>
    <div class="wb-tools">
      <input class="wb-search" id="wb-search" type="search" placeholder="搜索单词或中文释义…" />
      <span class="wb-count" id="wb-count"></span>
    </div>
    <div class="wb-alpha" id="wb-alpha"></div>
    <div class="wb-list" id="wb-list"></div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div class="social">
        <a href="https://home.gamer.com.tw/profile/index.php?owner=YangXi2025" title="我的巴哈姆特主页" aria-label="我的巴哈姆特主页">
          <img class="bahamut-icon" src="assets/images/bahamut-icon.png" alt="巴哈姆特" />
        </a>
      </div>
      <p>© <span id="year">2026</span> 林泉汐 · 用 ❤️ 和 Node.js 搭建</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      var E = App.escapeHtml;
      var LETTERS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
      var books = [];
      var current = null;
      var isAdmin = false;
      var activeBook = "";
      var filterLetter = "";
      var keyword = "";

      function todayLetter() {
        var base = new Date("2026-09-07T00:00:00");
        var d = new Date();
        var now = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        var n = Math.floor((now - base) / 86400000);
        var idx = ((n % 26) + 26) % 26;
        return LETTERS[idx];
      }

      function pickFive(words, letter) {
        var sorted = words.slice().sort(function (a, b) {
          return a.word.localeCompare(b.word);
        });
        var L = String(letter).toUpperCase();
        var start = -1;
        for (var i = 0; i < sorted.length; i++) {
          if (sorted[i].word.charAt(0).toUpperCase() >= L) { start = i; break; }
        }
        if (start < 0) start = 0;
        var out = [];
        for (var k = 0; k < 5 && k < sorted.length; k++) {
          out.push(sorted[(start + k) % sorted.length]);
        }
        return out;
      }

      function renderBooks() {
        var box = document.getElementById("book-grid");
        box.innerHTML = books
          .map(function (b) {
            return (
              '<button class="wb-card' + (b.id === activeBook ? " active" : "") + '" type="button" data-id="' + E(b.id) + '">' +
              '<span class="wb-card-level">' + E(b.level || "词汇") + "</span>" +
              '<span class="wb-card-name">' + E(b.name) + "</span>" +
              '<span class="wb-card-desc">' + E(b.desc) + "</span>" +
              '<span class="wb-card-foot"><span class="wb-chip">' + b.count + " 词</span>" +
              (b.id === activeBook ? '<span class="wb-flag">每日推送中</span>' : "") +
              "</span></button>"
            );
          })
          .join("");
        box.querySelectorAll(".wb-card").forEach(function (el) {
          el.addEventListener("click", function () {
            openBook(el.getAttribute("data-id"));
          });
        });
        document.getElementById("active-chip").textContent =
          "当前推送：" + ((books.filter(function (b) { return b.id === activeBook; })[0] || {}).name || "未设置");
      }

      function openBook(id) {
        App.api("/api/wordbooks/" + encodeURIComponent(id))
          .then(function (data) {
            current = data.book;
            filterLetter = "";
            keyword = "";
            document.getElementById("wb-search").value = "";
            document.getElementById("detail").hidden = false;
            document.getElementById("detail-title").textContent = current.name + " · " + current.words.length + " 词";
            var btn = document.getElementById("set-active");
            btn.hidden = !isAdmin;
            btn.textContent = current.id === activeBook ? "✅ 已是每日推送词书" : "✅ 设为每日推送词书";
            renderToday();
            renderAlpha();
            renderList();
            document.getElementById("detail").scrollIntoView({ behavior: "smooth", block: "start" });
          })
          .catch(function (err) {
            alert("加载词书失败：" + err.message);
          });
      }

      function renderToday() {
        var five = pickFive(current.words, todayLetter());
        document.getElementById("wb-today").innerHTML =
          '<div class="wb-today-head">今日 5 词 · 字母 ' + todayLetter() + "</div>" +
          '<div class="wb-today-words">' +
          five
            .map(function (w) {
              return (
                '<span class="wb-today-item"><span class="wb-today-top"><b>' + E(w.word) + "</b>" +
                App.speakBtn(w.word) + "</span>" +
                '<i>' + E(w.phonetic || "") + "</i>" +
                "<span>" + E(w.meaning) + "</span>" +
                metaHtml(w) +
                "</span>"
              );
            })
            .join("") +
          "</div>";
        App.bindSpeak(document.getElementById("wb-today"));
      }

      function metaHtml(w) {
        var out = "";
        if (w.synonyms && w.synonyms.length) {
          out +=
            '<span class="wmeta"><b>近义</b>' +
            w.synonyms.map(function (s) { return '<span class="wtag">' + E(s) + "</span>"; }).join("") +
            "</span>";
        }
        if (w.derivatives && w.derivatives.length) {
          out +=
            '<span class="wmeta"><b>派生</b>' +
            w.derivatives.map(function (s) { return '<span class="wtag">' + E(s) + "</span>"; }).join("") +
            "</span>";
        }
        return out;
      }

      function renderAlpha() {
        var have = {};
        current.words.forEach(function (w) {
          have[w.word.charAt(0).toUpperCase()] = true;
        });
        document.getElementById("wb-alpha").innerHTML =
          '<span class="wb-cell' + (filterLetter === "" ? " on" : "") + '" data-l="">全部</span>' +
          LETTERS.map(function (L) {
            if (!have[L]) return '<span class="wb-cell off">' + L + "</span>";
            return '<span class="wb-cell' + (filterLetter === L ? " on" : "") + '" data-l="' + L + '">' + L + "</span>";
          }).join("");
        document.querySelectorAll("#wb-alpha .wb-cell").forEach(function (el) {
          el.addEventListener("click", function () {
            if (el.classList.contains("off")) return;
            filterLetter = el.getAttribute("data-l") || "";
            renderAlpha();
            renderList();
          });
        });
      }

      function renderList() {
        var kw = keyword.trim().toLowerCase();
        var list = current.words.filter(function (w) {
          if (filterLetter && w.word.charAt(0).toUpperCase() !== filterLetter) return false;
          if (!kw) return true;
          return (
            w.word.toLowerCase().indexOf(kw) >= 0 ||
            String(w.meaning).toLowerCase().indexOf(kw) >= 0
          );
        });
        document.getElementById("wb-count").textContent = "显示 " + list.length + " / " + current.words.length + " 词";
        document.getElementById("wb-list").innerHTML = list.length
          ? list
              .map(function (w) {
                return (
                  '<div class="wb-row"><span class="wb-word">' + E(w.word) +
                  App.speakBtn(w.word) + "</span>" +
                  '<span class="wb-phon">' + E(w.phonetic || "") + "</span>" +
                  '<span class="wb-pos">' + E(w.pos || "") + "</span>" +
                  '<span class="wb-mean">' + E(w.meaning) + metaHtml(w) + "</span></div>"
                );
              })
              .join("")
          : '<p style="color:var(--ink-soft)">没有匹配的单词。</p>';
        App.bindSpeak(document.getElementById("wb-list"));
      }

      App.renderAuthUI();
      App.api("/api/words-settings")
        .then(function (s) { activeBook = s.activeBook || ""; })
        .catch(function () {})
        .then(function () {
          return App.api("/api/wordbooks");
        })
        .then(function (data) {
          books = data.books || [];
          if (!books.length) {
            document.getElementById("book-grid").innerHTML =
              '<div class="empty"><div class="big">📚</div>还没有词书。</div>';
            return;
          }
          renderBooks();
          return App.api("/api/me")
            .then(function (d) {
              isAdmin = !!(d.user && d.user.role === "admin");
            })
            .catch(function () {});
        })
        .then(function () {
          var btn = document.getElementById("set-active");
          btn.addEventListener("click", function () {
            if (!current) return;
            App.api("/api/words-settings", {
              method: "POST",
              body: { activeBook: current.id },
            })
              .then(function () {
                activeBook = current.id;
                renderBooks();
                btn.textContent = "✅ 已是每日推送词书";
              })
              .catch(function (err) {
                alert("设置失败（需要管理员登录）：" + err.message);
              });
          });
          document.getElementById("wb-search").addEventListener("input", function (e) {
            keyword = e.target.value || "";
            if (current) renderList();
          });
        })
        .catch(function (err) {
          document.getElementById("book-grid").innerHTML =
            '<p style="color:#e0577f">加载失败：' + E(err.message) + "</p>";
        });
    })();
  </script>
  <script>
    (function () {
      var l = document.getElementById("loader");
      function hideLoader() {
        if (!l) return;
        l.classList.add("hidden");
        setTimeout(function () { l.style.display = "none"; }, 600);
      }
      window.addEventListener("load", function () {
        setTimeout(hideLoader, 2600);
      });
      setTimeout(hideLoader, 5000);
    })();
  </script>
</body>
