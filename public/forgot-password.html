<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>找回密码 · 围坐篝火话天下</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html"><span class="dot"></span><span class="brand-text">勇者聚集人数 · <span class="online-num">0</span>人</span></a>
      <nav class="nav-links">
        <a href="index.html">首页</a>
        <a href="about.html">关于</a>
        <span id="auth-area" class="auth-area"></span>
      </nav>
    </div>
  </header>

  <section class="section wrap">
    <div class="section-head reveal">
      <h2><span class="emoji">🔑</span> 找回密码</h2>
    </div>
    <form class="editor reveal" id="forgot-form" style="max-width:460px; margin:0 auto">
      <p style="color:var(--ink-soft)">输入注册时使用的邮箱，我们会发送一封重置密码的邮件。</p>
      <label class="field" style="margin-top:16px">
        <span>邮箱</span>
        <input type="email" name="email" placeholder="you@example.com" required />
      </label>
      <div class="actions" style="margin-top:20px">
        <button type="submit" class="btn btn-primary">发送重置邮件</button>
        <a class="btn btn-ghost" href="login.html">返回登录</a>
      </div>
      <div class="hint" id="msg"></div>
    </form>
  </section>

  <footer class="footer">
    <div class="wrap">
      <p>© <span id="year">2026</span> 林泉汐 · 用 ❤️ 和 Node.js 搭建</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      App.renderAuthUI();
      var form = document.getElementById("forgot-form");
      var msg = document.getElementById("msg");
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        msg.textContent = "发送中…";
        App.api("/api/forgot-password", {
          method: "POST",
          body: { email: form.email.value.trim() },
        })
          .then(function () {
            msg.textContent = "若邮箱存在，重置链接已发送（开发模式下见服务端日志）。请查收邮件。";
            form.reset();
          })
          .catch(function (err) { msg.textContent = "失败：" + err.message; });
      });
    })();
  </script>
</body>
</html>
