<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>林泉汐 · 个人博客</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <meta name="description" content="一个用 Node 驱动的动态个人博客。" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="loader" class="loader">
    <svg class="pixel-scene" viewBox="0 0 120 130" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">
      <!-- 月亮（居中偏右） -->
      <circle cx="88" cy="22" r="11" fill="#ffe082"/>
      <!-- 星星 -->
      <rect x="22" y="18" width="2" height="2" fill="#ffffff" opacity="0.8"/>
      <rect x="36" y="30" width="2" height="2" fill="#ffffff" opacity="0.6"/>
      <rect x="70" y="14" width="2" height="2" fill="#ffffff" opacity="0.7"/>
      <!-- 地面 -->
      <rect x="8" y="104" width="104" height="10" fill="#2a1d18"/>
      <!-- 小屋 -->
      <polygon points="30,64 56,42 82,64" fill="#5d4037"/>
      <rect x="34" y="64" width="44" height="40" fill="#6d4c41"/>
      <!-- 门 -->
      <rect x="52" y="82" width="12" height="22" fill="#3e2723"/>
      <rect x="60" y="92" width="2" height="3" fill="#ffca28"/>
      <!-- 窗（暖光呼吸） -->
      <rect class="window-glow" x="40" y="74" width="10" height="10" fill="#ffd54f"/>
      <rect x="40" y="74" width="10" height="10" fill="none" stroke="#3e2723" stroke-width="1"/>
      <!-- 篝火木柴 -->
      <rect x="47" y="98" width="20" height="4" fill="#5d4037"/>
      <rect x="50" y="95" width="14" height="3" fill="#4e342e"/>
      <!-- 火焰外层 -->
      <g class="fire">
        <rect x="52" y="88" width="12" height="12" fill="#d84315"/>
        <rect x="54" y="82" width="8" height="10" fill="#ff6d00"/>
        <rect x="56" y="75" width="4" height="9" fill="#ff8f00"/>
      </g>
      <!-- 火焰内层 -->
      <g class="fire-inner">
        <rect x="55" y="84" width="6" height="10" fill="#ffca28"/>
        <rect x="56" y="78" width="4" height="8" fill="#fff176"/>
        <rect x="57" y="72" width="2" height="6" fill="#fffde7"/>
      </g>
      <!-- 火星 -->
      <circle class="spark" cx="58" cy="76" r="1.6" fill="#ffab40"/>
      <circle class="spark s2" cx="53" cy="78" r="1.3" fill="#ffca28"/>
      <circle class="spark s3" cx="62" cy="76" r="1.4" fill="#ff7043"/>
    </svg>
    <p class="loader-text">林泉汐的小屋 · 加载中</p>
    <div class="loader-bar"><span></span></div>
  </div>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html"><span class="dot"></span>小站</a>
      <nav class="nav-links">
        <a class="nav-btn" href="publish.html">✍️ 发布</a>
        <a href="index.html" class="active">首页</a>
        <a href="about.html">关于</a>
        <span id="auth-area" class="auth-area"></span>
      </nav>
    </div>
  </header>

  <section class="hero wrap">
    <span class="badge">✨ 欢迎来到我的小宇宙</span>
    <h1>你好，我是 <span class="hl">林泉汐</span> <span class="floaty">👋</span></h1>
    <p>这里收集我的生活碎片、学习笔记和一些不成熟的想法。慢慢写，慢慢看。</p>
    <div>
      <a class="btn btn-primary" href="index.html#articles">📚 读读文章</a>
      <a class="btn btn-ghost" href="about.html">👀 了解我</a>
    </div>
  </section>

  <section class="section wrap" id="articles">
    <div class="section-head reveal">
      <h2><span class="emoji">🆕</span> 最新文章</h2>
    </div>
    <div class="cards" id="article-list">
      <p style="color:var(--ink-soft)">正在加载文章…</p>
    </div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div class="social">
        <a href="https://home.gamer.com.tw/profile/index.php?owner=YangXi2025" title="我的巴哈姆特主页" aria-label="我的巴哈姆特主页">
          <img class="bahamut-icon" src="assets/images/bahamut-icon.png" alt="巴哈姆特" />
        </a>
      </div>
      <p>© <span id="year">2026</span> 林泉汐 · 用 ❤️ 和 Node.js 搭建</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      App.renderAuthUI();
      App.api("/api/articles")
        .then(function (data) {
          var list = document.getElementById("article-list");
          var articles = data.articles || [];
          if (articles.length === 0) {
            list.innerHTML =
              '<div class="empty"><div class="big">📝</div>还没有文章，点右上角「发布」写第一篇吧！</div>';
            return;
          }
          list.innerHTML = articles
            .map(function (a) {
              return (
                '<article class="card reveal">' +
                '<span class="tag ' + App.tagClass(a.tag) + '">' + App.escapeHtml(a.tag) + "</span>" +
                '<h3><a href="article.html?id=' + encodeURIComponent(a.id) + '">' + App.escapeHtml(a.title) + "</a></h3>" +
                "<p>" + App.escapeHtml(a.excerpt) + "</p>" +
                '<div class="meta"><span>📅 ' + App.escapeHtml(a.date) + "</span><span>✍️ " + App.escapeHtml(a.author || "匿名") + "</span></div>" +
                "</article>"
              );
            })
            .join("");
          // 文章卡片是动态生成的，main.js 的滚动观察器观察不到，手动补上显示
          list.querySelectorAll(".reveal").forEach(function (el) {
            el.classList.add("in");
          });
        })
        .catch(function (err) {
          document.getElementById("article-list").innerHTML =
            '<p style="color:#e0577f">加载失败：' + App.escapeHtml(err.message) + "</p>";
        });
    })();
  </script>
  <script>
    (function () {
      var l = document.getElementById("loader");
      function hideLoader() {
        if (!l) return;
        l.classList.add("hidden");
        setTimeout(function () { l.style.display = "none"; }, 600);
      }
      window.addEventListener("load", function () {
        setTimeout(hideLoader, 2600);
      });
      // 兜底：若 load 久未触发，最多 5s 强制隐藏，避免卡死
      setTimeout(hideLoader, 5000);
    })();
  </script>
</body>
</html>
