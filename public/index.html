<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>林泉汐 · 个人博客</title>
  <meta name="description" content="一个用 Node 驱动的动态个人博客。" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html"><span class="dot"></span>小站</a>
      <nav class="nav-links">
        <a class="nav-btn" href="publish.html">✍️ 发布</a>
        <a href="index.html" class="active">首页</a>
        <a href="about.html">关于</a>
        <span id="auth-area" class="auth-area"></span>
      </nav>
    </div>
  </header>

  <section class="hero wrap">
    <span class="badge">✨ 欢迎来到我的小宇宙</span>
    <h1>你好，我是 <span class="hl">林泉汐</span> <span class="floaty">👋</span></h1>
    <p>这里收集我的生活碎片、学习笔记和一些不成熟的想法。慢慢写，慢慢看。</p>
    <div>
      <a class="btn btn-primary" href="index.html#articles">📚 读读文章</a>
      <a class="btn btn-ghost" href="about.html">👀 了解我</a>
    </div>
  </section>

  <section class="section wrap" id="articles">
    <div class="section-head reveal">
      <h2><span class="emoji">🆕</span> 最新文章</h2>
    </div>
    <div class="cards" id="article-list">
      <p style="color:var(--ink-soft)">正在加载文章…</p>
    </div>
  </section>

  <footer class="footer">
    <div class="wrap">
      <div class="social">
        <a href="https://home.gamer.com.tw/profile/index.php?owner=YangXi2025" title="我的巴哈姆特主页" aria-label="我的巴哈姆特主页">
          <img class="bahamut-icon" src="assets/images/bahamut-icon.png" alt="巴哈姆特" />
        </a>
      </div>
      <p>© <span id="year">2026</span> 林泉汐 · 用 ❤️ 和 Node.js 搭建</p>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    (function () {
      App.renderAuthUI();
      App.api("/api/articles")
        .then(function (data) {
          var list = document.getElementById("article-list");
          var articles = data.articles || [];
          if (articles.length === 0) {
            list.innerHTML =
              '<div class="empty"><div class="big">📝</div>还没有文章，点右上角「发布」写第一篇吧！</div>';
            return;
          }
          list.innerHTML = articles
            .map(function (a) {
              return (
                '<article class="card reveal">' +
                '<span class="tag ' + App.tagClass(a.tag) + '">' + App.escapeHtml(a.tag) + "</span>" +
                '<h3><a href="article.html?id=' + encodeURIComponent(a.id) + '">' + App.escapeHtml(a.title) + "</a></h3>" +
                "<p>" + App.escapeHtml(a.excerpt) + "</p>" +
                '<div class="meta"><span>📅 ' + App.escapeHtml(a.date) + "</span><span>⏱ " + App.escapeHtml(a.readTime) + "</span></div>" +
                "</article>"
              );
            })
            .join("");
          // 文章卡片是动态生成的，main.js 的滚动观察器观察不到，手动补上显示
          list.querySelectorAll(".reveal").forEach(function (el) {
            el.classList.add("in");
          });
        })
        .catch(function (err) {
          document.getElementById("article-list").innerHTML =
            '<p style="color:#e0577f">加载失败：' + App.escapeHtml(err.message) + "</p>";
        });
    })();
  </script>
</body>
</html>
