# Render 部署配置（Blueprint）
# 在 Render 控制台：New → Blueprint → 连接本仓库即可自动读取此文件
services:
  - type: web
    name: lin-quan-xi-blog
    runtime: node
    plan: free
    branch: main
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /
    # 持久化磁盘：挂载到 /var/data，发布/修改/删除的文章在实例重启或休眠后仍保留
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
